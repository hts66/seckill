server.port: 8102
spring:
  config.import: optional:nacos:seckill-product-service.yml
  application.name: seckill-product-service
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${PRODUCT_DB:seckill_product}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
security.internal-token: ${INTERNAL_TOKEN:}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9010}
  public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT:http://localhost:9010}}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:seckill}
management.endpoints.web.exposure.include: health,info
